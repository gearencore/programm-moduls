
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>

<body>

    <h1>Вход</h1>

    <form method="POST">

        <p>
            <label>Электронная почта:</label><br>
            <input
                type="email"
                name="email"
                placeholder="Введите почту"
                required
            >
        </p>

        <p>
            <label>Пароль:</label><br>
            <input
                type="password"
                name="password"
                placeholder="Введите пароль"
                required
            >
        </p>

        <button type="submit">Войти</button>

    </form>

    <p>{{ message }}</p>

    <a href="/">На главную</a>

</body>

</html>
